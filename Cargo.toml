[workspace]
members = [
    "crates/loco-protobuf",
    "examples/demo-app",
    "examples/real-app"
]
resolver = "2"

[workspace.dependencies]
loco-rs = "0.16"
axum = "0.8"
tokio = { version = "1.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prost = "0.13"
loco-protobuf = { path = "crates/loco-protobuf" }
